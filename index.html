<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://runguard-dev.github.io/" />
    <link rel="canonical" href="https://runguard-dev.github.io/" />
    <title>RunGuard has moved</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1117;
        color: #f3f7fb;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        max-width: 560px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #a8b3bf;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: #65e4c6;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus,
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      window.location.replace("https://runguard-dev.github.io/");
    </script>
  </head>
  <body>
    <main>
      <h1>RunGuard has moved.</h1>
      <p>The public RunGuard for GitHub website now lives at its dedicated GitHub organization.</p>
      <a href="https://runguard-dev.github.io/">Open runguard-dev.github.io</a>
    </main>
  </body>
</html>
